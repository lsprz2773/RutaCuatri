name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    name: Lint, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint y formato
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Pruebas del motor (77 casos y propiedades)
        run: npm test

      - name: Experimentos A a D (comprueba los valores de referencia)
        run: npm run experimento -- --repeticiones 1

      - name: Build estático
        run: npm run build

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Pruebas E2E
        run: npm run e2e

      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
